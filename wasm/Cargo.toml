[package]
name = "romania-search"
version = "0.1.0"
edition = "2021"

[lib]
name = "romania_search"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "cli"
path = "src/bin/cli.rs"

[[bin]]
name = "export_sample"
path = "src/bin/export_sample.rs"

[[bin]]
name = "export_all_pairs"
path = "src/bin/export_all_pairs.rs"

[[bin]]
name = "export_all_runtimes"
path = "src/bin/export_all_runtimes.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
