name: CI

# Gates the five invariants in CLAUDE.md. Every check here is a script in scripts/,
# the same ones `/prevent` runs locally — this file holds no check logic of its own,
# so a green local `npm run verify` means a green build.

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Neither job writes anything: they read the tree and run checks. The deploy job added
# at build step 6 needs `pages: write` and `id-token: write` -- grant those on that job
# alone rather than widening this default.
permissions:
  contents: read

jobs:
  correctness:
    name: Invariants, parity, correctness
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Each verify script builds Rust into its own mktemp directory, so a full run used
    # to compile the crate four times and keep nothing between runs. Setting this makes
    # every script share one directory that the cache step below can restore.
    # Locally the variable is unset and the scripts keep their throwaway directories.
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cargo-target

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # rust-toolchain.toml pins the version; rustup installs it on first use so
      # every machine and this runner produce identical warnings and lints.
      # Keyed on the lockfile and the pinned toolchain: a dependency or a Rust version
      # change invalidates it, anything else reuses the previous run's artifacts.
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}/.cargo-target
          key: cargo-${{ runner.os }}-${{ hashFiles('wasm/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Resolve pinned Rust toolchain
        run: rustc --version && cargo --version

      - name: Show compiler versions
        run: g++ --version && python3 --version

      # I1 (one search function), I4 (engine stays wasm-safe), and clean builds
      # of all three implementations.
      - name: Structural invariants
        run: npm run verify:invariants

      # I2 — Rust, C++ and Python must produce identical explored order and counters.
      # The most serious failure in this project: drift is silent, and it invalidates
      # every number in the report.
      - name: Three-language parity
        run: npm run verify:parity

      # I3 — 400 pairs against an independent Dijkstra, plus admissibility and
      # consistency on every goal and edge.
      - name: Heuristic correctness
        run: npm run verify:correctness

      # The fixed point parity cannot provide: parity compares the three implementations
      # to each other, so a change made to all three at once keeps it green. The road
      # table lives in three encodings, so that is exactly what editing a road looks like.
      - name: Golden baseline
        run: npm run verify:golden

      # Checks the harness itself is wired -- the PostToolUse hooks silently stopped
      # firing once before, and nothing noticed. See docs/runbook.md §2.
      - name: Harness wiring
        run: npm run verify:harness

      # The committed sample the browser animates, checked against the engine that
      # generated it, plus the road table lib/romaniaGraph.ts duplicates. Lives here
      # rather than in `frontend` because it runs the exporter: this job already has
      # the pinned toolchain and a warm CARGO_TARGET_DIR, so the crate is built by now.
      - name: Frontend sample freshness
        run: npm run verify:frontend-sample

  frontend:
    name: Frontend types
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve pinned Rust toolchain and Wasm target
        run: rustc --version && rustup target list --installed

      - name: Cache wasm-pack
        uses: actions/cache@v4
        with:
          path: /home/runner/.cargo/bin/wasm-pack
          key: wasm-pack-linux-0.15.0

      - name: Install wasm-pack
        run: command -v wasm-pack > /dev/null || cargo install wasm-pack --version 0.15.0 --locked

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # tsc --noEmit is not the same check as a real build: it does not catch 
      # "use client" boundary violations, invalid route segment exports, or a 
      # server-only import pulled into a client component. 
      - name: Build
        run: npm run build

# --- Not yet enabled -------------------------------------------------------------
#
# deploy job: remains Step 6 work. The frontend build already produces the Wasm module
#   and a static export; deployment still needs Pages permissions and upload/deploy actions.
