# Dependency updates for the three ecosystems this repository actually uses.
#
# Monthly and grouped rather than weekly and individual: ungrouped updates across three
# ecosystems produce enough pull requests that people stop reading them, and a dependency
# PR nobody reads is worse than no dependency PR.
#
# Note for cargo: wasm/Cargo.lock is the cache key in .github/workflows/ci.yml, so a cargo
# update invalidates the cargo cache and that PR's CI run will be slow. Expected, not a fault.

version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /wasm
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      cargo:
        patterns: ["*"]

  # The actions are SHA-pinned in ci.yml, mutation.yml and deploy.yml. A pin is only safe
  # while something moves it forward when the upstream action is patched, which is this.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
