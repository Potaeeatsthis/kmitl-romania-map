# Pins the toolchain so every machine and CI produce the same clippy lints,
# the same rustfmt output, and the same warnings. Without this, collaborators on
# different Rust versions get different local results and disagree with CI.
#
# Add targets = ["wasm32-unknown-unknown"] at build step 4. It is left out for now
# because listing it makes every CI run download a standard library nothing uses yet.
[toolchain]
channel = "1.95.0"
components = ["rustfmt", "clippy"]
targets = ["wasm32-unknown-unknown"]
